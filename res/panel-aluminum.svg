<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="40.64mm" height="128.5mm"
     viewBox="0 0 40.64 128.5">
  <!-- Panel background: aluminum silver -->
  <rect width="40.64" height="128.5" fill="#c8c8c8"/>
  <!-- Mounting holes -->
  <circle cx="7.62"  cy="7.62"   r="1.6" fill="#aaa"/>
  <circle cx="33.02" cy="7.62"   r="1.6" fill="#aaa"/>
  <circle cx="7.62"  cy="120.88" r="1.6" fill="#aaa"/>
  <circle cx="33.02" cy="120.88" r="1.6" fill="#aaa"/>
  <!-- Module title -->
  <text x="20.32" y="17" text-anchor="middle"
        font-family="sans-serif" font-size="5" font-weight="bold" fill="#222">AI004</text>
  <text x="20.32" y="23" text-anchor="middle"
        font-family="sans-serif" font-size="2.8" fill="#555">OTA VCF</text>
  <!-- Knob labels (placed below each knob position) -->
  <text x="11"    y="47" text-anchor="middle" font-family="sans-serif" font-size="2.2" fill="#333">CUTOFF</text>
  <text x="29"    y="47" text-anchor="middle" font-family="sans-serif" font-size="2.2" fill="#333">RES</text>
  <text x="11"    y="80" text-anchor="middle" font-family="sans-serif" font-size="2.2" fill="#333">CV AMT</text>
  <!-- LP/HP switch labels (LP above switch position, HP below) -->
  <text x="27" y="64" text-anchor="middle" font-family="sans-serif" font-size="2.2" fill="#333">LP</text>
  <text x="27" y="76" text-anchor="middle" font-family="sans-serif" font-size="2.2" fill="#333">HP</text>
  <!-- Divider line above jacks -->
  <line x1="3" y1="90" x2="37.64" y2="90" stroke="#aaa" stroke-width="0.3"/>
  <!-- Jack labels (placed below each jack position) -->
  <text x="8"     y="112" text-anchor="middle" font-family="sans-serif" font-size="2.2" fill="#333">IN</text>
  <text x="20.32" y="112" text-anchor="middle" font-family="sans-serif" font-size="2.2" fill="#333">CV</text>
  <text x="32"    y="112" text-anchor="middle" font-family="sans-serif" font-size="2.2" fill="#333">OUT</text>
</svg>
